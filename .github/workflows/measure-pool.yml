name: Measure candidate resolution
on:
  workflow_dispatch:
    inputs:
      entities: { description: "Entity ids separated by spaces", required: true }
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/measure_pool.py ${{ github.event.inputs.entities }}
      - name: Commit
        if: always()
        run: |
          git config user.name "tumtul-bot"; git config user.email "tumtul-bot@users.noreply.github.com"
          git add pool_sizes; git diff --cached --quiet || git commit -m "Candidate pixel sizes $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 7; done
