name: Fetch Commons candidates
on:
  workflow_dispatch:
    inputs:
      entities:
        description: "Entity ids separated by spaces (empty = all)"
        required: false
        default: ""
  push:
    paths: ["tools/commons_queries.json", "tools/fetch_commons.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/fetch_commons.py ${{ github.event.inputs.entities }}
      - name: Commit candidates
        if: always()
        run: |
          git config user.name "tumtul-bot"
          git config user.email "tumtul-bot@users.noreply.github.com"
          git add candidates
          git diff --cached --quiet || git commit -m "Commons candidates $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
