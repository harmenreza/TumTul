name: Fetch full-resolution originals
on:
  workflow_dispatch:
  push:
    paths: ["tools/image_picks.json", "tools/fetch_hires.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/fetch_hires.py
      - name: Commit originals
        if: always()
        run: |
          git config user.name "tumtul-bot"
          git config user.email "tumtul-bot@users.noreply.github.com"
          git add hires
          git diff --cached --quiet || git commit -m "Full-resolution originals $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 20 + 5)); done
